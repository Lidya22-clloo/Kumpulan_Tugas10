<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <h1>Medical Form</h1>

    <form>
        <label for="nama">Name Of Patient:</label>
        <input type="text" required>
        <br>
        <br>
        <label for="Tanggal">Date Of Birth:</label>
        <input type="date" required>
        <br>
        <br>
        <label for="email">Email Address:</label>
        <input type="email" required>
        <br>
        <br>
        <label for="nomer">Phone Number:</label>
        <input type="number" required>
        <h2>Medical History</h2>
        <label for="histori">Do you have any known allergies? if yes please list: </label>
        <br>
        <textarea name="histori" cols="40" rows="2"></textarea>
        <br>
        <br>
        <label for="check">Have You Ever Had Any Of The Following Conditions? (check all that apply)</label>
        <br>
        <input type="checkbox" value="heart disease" name="check">
        <label for="heart disease">Heart Disease</label>
        <br>
        <input type="checkbox" value="diabetes" name="check">
        <label for="diabetes">Diabetes</label>
        <br>
        <input type="checkbox" value="cancer" name="check">
        <label for="cancer">Cancer</label>
        <br>
        <input type="checkbox" value="stroke" name="check">
        <label for="stroke">Stroke</label>
        <h2>Main CornCern</h2>
        <label for="concern">What symptoms or corncerns have you been experiencing?</label>
        <br>
        <textarea name="concern" cols="40" rows="4"></textarea>
        <br>
        <br>
        <input type="submit" name="submit" value="submit">




    </form>
</body>
</html>
